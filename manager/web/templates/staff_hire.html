{% extends "base.html" %}
{% block title %}Contratar staff{% endblock %}
{% block content %}
<h1>Contratar · {{ staff_labels[role] }}</h1>
<div class="card"><table><thead><tr><th>Candidato</th><th class="num">Rating</th><th class="num">Salario</th><th></th></tr></thead><tbody>
{% for c in candidates %}<tr><td>{{ c.name }}</td><td class="num">{{ c.rating }}</td><td class="num">{{ c.salary|money }}</td><td><form method="post"><input type="hidden" name="candidate" value="{{ loop.index0 }}"><button class="btn primary small">Contratar</button></form></td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
